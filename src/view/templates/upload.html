<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Adicionar Trabalho</title>
<link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
<h1>Adicionar Trabalho</h1>
<form id="uploadForm" enctype="multipart/form-data">
<input type="text" name="titulo" placeholder="Título" required><br>
<input type="text" name="autor" placeholder="Autor" required><br>
<input type="text" name="curso" placeholder="Curso" required><br>
<input type="number" name="ano" placeholder="Ano" required><br>
<textarea name="descricao" placeholder="Descrição"></textarea><br>
<label>PDF:</label><input type="file" name="pdf" accept=".pdf" required><br>
<label>Capa:</label><input type="file" name="capa" accept="image/*"><br>
<button type="submit">Enviar</button>
</form>
<script>
const form = document.getElementById('uploadForm');
form.addEventListener('submit', e=>{
    e.preventDefault();
    const data = new FormData(form);
    fetch('/works/add',{
        method:'POST',
        body:data
    }).then(res=>res.json()).then(d=>alert(d.message || d.error));
});
</script>
</body>
</html>
